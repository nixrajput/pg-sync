name: Version Check

# Every PR must bump the root VERSION file (plain "x.y.z"). Release tags it on
# merge. Used by repos with no package manifest (Go, C++, Shell).
# A PR that changes only .github/ or the agent guides (AGENTS.md, CLAUDE.md,
# .claude/) ships nothing, so it needs no bump. The job still passes, so the
# required check reports.
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  version-bumped:
    name: version bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the base branch to diff the version
          persist-credentials: false
      - name: Detect a no-ship change
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only --no-renames "$BASE...$HEAD")
          if grep -vqE '^(\.github/|\.claude/|AGENTS\.md$|CLAUDE\.md$)' <<< "$changed"; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only .github/ and agent guides changed - nothing ships, no bump needed ✓"
            echo "ship=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read versions
        if: steps.scope.outputs.ship == 'true'
        id: v
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          pr=$(tr -d ' \r\n' < VERSION)
          # If VERSION doesn't exist on the base yet (the PR that introduces it),
          # treat the base as 0.0.0 so any real version passes the bump check.
          base=$(git show "origin/$BASE_REF:VERSION" 2>/dev/null | tr -d ' \r\n' || true)
          base=${base:-0.0.0}
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Compare
        if: steps.scope.outputs.ship == 'true'
        env:
          PR: ${{ steps.v.outputs.pr }}
          BASE: ${{ steps.v.outputs.base }}
        run: |
          echo "base=$BASE  pr=$PR"
          if [ "$PR" = "$BASE" ]; then
            echo "::error::VERSION not bumped (still $BASE)."
            exit 1
          fi
          greater=$(printf '%s\n%s\n' "$BASE" "$PR" | sort -V | tail -n1)
          if [ "$greater" != "$PR" ]; then
            echo "::error::VERSION $PR is lower than base $BASE."
            exit 1
          fi
          echo "Version bumped $BASE -> $PR ✓"
