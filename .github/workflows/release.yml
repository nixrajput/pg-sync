name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        env:
          SC_VERSION: v0.11.0
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=linux.x86_64 sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 ;;
            macOS-ARM64) asset=darwin.aarch64 sha=56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79 ;;
            *) echo "::error::No pinned shellcheck for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL -o sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/$SC_VERSION/shellcheck-$SC_VERSION.$asset.tar.xz"
          echo "$sha  sc.tar.xz" | shasum -a 256 -c -
          tar -xJf sc.tar.xz
          echo "$RUNNER_TEMP/shellcheck-$SC_VERSION" >> "$GITHUB_PATH"

      - name: Lint
        run: make lint

      - name: Build artifacts
        run: bash scripts/build.sh --no-binary

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Deduplicate artifacts
        run: |
          mkdir -p release
          # All matrix builds produce the same portable tarball; keep one copy.
          # The build is reproducible because src/pg-sync is the only input.
          find artifacts -type f -name "pg-sync-*.tar.gz" | head -1 | xargs -I {} cp {} release/
          find artifacts -type f -name "pg-sync-*.tar.gz.sha256" | head -1 | xargs -I {} cp {} release/
          ls -lh release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
