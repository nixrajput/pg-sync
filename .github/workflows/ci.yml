name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning # match the repo's `make lint` convention
          version: v0.11.0
        env:
          SHELLCHECK_OPTS: -e SC1090 -e SC1091
      - name: Make check (if a check/test target exists)
        run: |
          if [ -f Makefile ] && grep -qE '^(check|test):' Makefile; then
            make check 2>/dev/null || make test
          else
            echo "no Makefile check/test target — shellcheck only"
          fi
